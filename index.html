<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main
        {
            width:400px;
            height:400px;
            border: 2px solid black;
            margin-left:50px;
            margin-top:20px;
            background-color: #555;
            border-radius: 10px;
           box-shadow: 0px 4px 10px #6e6e6e;
        }
        .heading
        {
           position: relative;
           top:30px;
            margin-left:60px;
            font-family: 'Poppins', sans-serif;
            font-size: 21px;
            font-weight: 600;
            color: white;
           
        }
        #email
        {
            margin-left:30px;
            margin-top: 20px;
            width:300px;
            padding:10px;
            border-radius: 10px;
            font-size: 15px;
         
        }
        #pass
        {
            margin-bottom: 20px;
            margin-left:30px;
            width:300px;
            padding:10px;
            border-radius: 10px;
            font-size: 15px;
            position: relative;
            bottom:20px;

        }
        .email-top
        {
            margin-top: 10px;
            color:white;
            margin-left:30px;
            padding-top:30px;
           
        }
        .email-top{
        position: relative;
        top: 15px;
          }
       .pass-top
       {
         margin-top: 10px;
            color:white;
            margin-left:30px;
            padding-top:30px;
            position: relative;
            bottom:20px;
         
       }
       #submit
       {
       
            margin-left:50px;
            margin-top: 20px;
            width:250px;
            padding:10px;
            border-radius: 10px;
            font-size: 15px;
            position: relative;
            bottom:30px;
            background-color: aqua;

       }
       .resultmsg
       {
         color:white;
         position:relative;
         left: 100px;
         font-size: 18px;
         font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
         font-weight: 600;
         bottom:25px;
        
       }
       .error-email
       {
         display: none;
        color:red;
        margin-left: 110px;
        font-size: 15px;
        font-weight: 600px;
        position: relative;
        top:10px;

       }
       .error-pass
       {
        display: none;
        color:red;
        margin-left: 110px;
        font-size: 15px;
        font-weight: 600px;
        position: relative;
        bottom: 30px;
       }
       

    </style>
</head>
<body>
    <div class="main">
        <form>
        <div class="heading">Email & Password Validator</div>
        <div class="email">
            <div class="email-top">Email:</div>
            <input type="email" placeholder="Enter your email" id="email">
            <br>
            <small class="error-email"></small>
        </div>
        <div class="password">
            <div class="pass-top">Password:</div>
            <input type="password" placeholder="Enter your password" id="pass">
            <br>
              <small class="error-pass"></small>
        </div>
        <div class="submit">
            <input type="submit" value="Validate" id="submit">
        </div>
        <div class="resultmsg">
        </div>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
